services:
  - type: web
    name: app-scriptflow-pro
    runtime: static
    buildCommand: echo "Static site - no build needed"
    staticPublishPath: ./
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
    healthCheckPath: /
    scaling:
      minInstances: 1
      maxInstances: 1
    plan: free
