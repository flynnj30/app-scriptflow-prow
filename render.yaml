services:
  - type: web
    name: scriptflow-pro
    runtime: static
    buildCommand: npm install
    staticPublishPath: .
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    healthCheckPath: /
    autoDeploy: true
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    plan: free
    pullRequestPreviewsEnabled: true